url: https://alexandercoppock.com/metaprep/

template:
  bootstrap: 5
  theme: gruvbox-light
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  bslib:
    primary: '#a72f5b'
    body-bg: '#FBFAF7'
    body-color: '#3C444C'
    link-color: '#a72f5b'
    link-hover-color: '#7d2244'
    border-color: '#E4E0D8'
    muted-color: '#6B7078'
    rule-color: '#E4E0D8'
    rule-strong: '#D6D1C6'
    accent-teal: '#004c6d'
    code-bg: '#F3EFE7'
    border-radius: '2px'
    btn-border-radius: '2px'
    font-size-base: '1.0625rem'
    line-height-base: '1.6'
    font-family-sans-serif: '"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'
    headings-font-family: '"Source Serif 4", Georgia, "Times New Roman", serif'
    font-family-monospace: '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace'
    headings-font-weight: '600'
    code-color: '#004c6d'
home:
  title: metaprep
  description: >
    Keep coefficient estimates and their variance-covariance matrix
    synchronized through dplyr operations, for multi-arm meta-analysis
    with metafor.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

reference:
- title: Overview
  desc: Start here.
  contents:
  - metaprep-package
  - estimates_vcov

- title: Preparing model fits
  desc: Extract tidy estimates, model summaries, and vcov subsets from a fitted model.
  contents:
  - prep_fit

- title: estimates_vcov objects
  desc: >
    Construct the synchronized estimates + vcov object and operate on it
    with dplyr verbs.
  contents:
  - as_estimates_vcov
  - make_estimates_vcov
  - bind_estimates_vcov
  - rescale_estimates_vcov
  - dplyr-methods

- title: Extracting components
  desc: Pull estimates, model-level summaries, or the vcov matrix back out.
  contents:
  - get_estimates_df
  - get_glance_df
  - get_vcov

- title: Meta-analysis
  desc: Convenience wrappers around metafor that read directly from an estimates_vcov object.
  contents:
  - rma_mv_helper
  - rma_uni_helper
